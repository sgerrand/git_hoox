name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: hex
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          otp-version: "27"
          elixir-version: "1.19"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-1.19-27-${{ hashFiles('**/mix.lock') }}

      - run: mix deps.get

      - name: Verify tag matches mix.exs version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          MIX_VERSION=$(grep -E '^\s*@version\s+"' mix.exs | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "v$MIX_VERSION" != "$TAG" ]; then
            echo "Tag $TAG does not match mix.exs v$MIX_VERSION"
            exit 1
          fi

      - run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
