name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: hex
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "27"
          elixir-version: "1.19"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-1.19-27-${{ hashFiles('**/mix.lock') }}

      - run: mix deps.get

      - name: Verify tag matches mix.exs version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          MIX_VERSION=$(grep -E '^\s*@version\s+"' mix.exs | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "v$MIX_VERSION" != "$TAG" ]; then
            echo "Tag $TAG does not match mix.exs v$MIX_VERSION"
            exit 1
          fi

      - run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
