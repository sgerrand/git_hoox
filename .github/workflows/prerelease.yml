name: Pre-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: >
          Pre-release version. Accepts X.Y.Z-(rc|beta|alpha|next|pre|dev).N,
          or the bare next-channel form X.Y.Z-next (N auto-incremented).
        required: true
        type: string

permissions:
  contents: write

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_BATON_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BATON_PRIVATE_KEY }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Resolve version
        id: resolve
        env:
          INPUT: ${{ github.event.inputs.version }}
        run: |
          # next-channel shorthand: X.Y.Z-next → auto-bump the trailing N
          if printf '%s' "$INPUT" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-next$'; then
            BASE="$INPUT"
            ESCAPED=$(printf '%s' "$BASE" | sed -e 's/[.[\*^$\\]/\\&/g')
            LAST_N=$(git ls-remote --tags origin \
              | awk '{print $2}' \
              | sed -nE "s|^refs/tags/v${ESCAPED}\.([0-9]+)\$|\1|p" \
              | sort -n \
              | tail -1)
            N=$(( ${LAST_N:-0} + 1 ))
            VERSION="${BASE}.${N}"
            echo "next-channel: $INPUT -> $VERSION (last N: ${LAST_N:-none})"
          elif printf '%s' "$INPUT" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-(rc|beta|alpha|next|pre|dev)\.[0-9]+$'; then
            VERSION="$INPUT"
          else
            echo "::error::Version must match X.Y.Z-(rc|beta|alpha|next|pre|dev).N or X.Y.Z-next, got: $INPUT"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Refuse if tag exists
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists locally"
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "::error::Tag v$VERSION already exists on origin"
            exit 1
          fi

      - name: Bump @version in mix.exs
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          if ! grep -qE '^\s*@version "' mix.exs; then
            echo "::error::Could not find @version in mix.exs"
            exit 1
          fi
          sed -i -E "s/^([[:space:]]*@version )\"[^\"]+\"/\1\"$VERSION\"/" mix.exs
          grep '^\s*@version' mix.exs

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Branch, commit, push
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          BRANCH="prerelease/v$VERSION"
          git checkout -b "$BRANCH"
          git add mix.exs
          git commit -m "chore(release): cut v$VERSION"
          git push --set-upstream origin "$BRANCH"

      - name: Create GitHub tag and pre-release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --prerelease \
            --title "v$VERSION" \
            --target "prerelease/v$VERSION" \
            --notes "Pre-release. See CHANGELOG.md on main for details once promoted."
