name: CI (slow)

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "lib/git_hoox/git.ex"
      - "lib/git_hoox/installer.ex"
      - ".github/workflows/ci-slow.yml"

permissions:
  contents: read

jobs:
  git-matrix:
    name: Git ${{ matrix.git }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        git: ["2.30.2", "2.39.5", "2.45.2", "latest"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install git ${{ matrix.git }}
        env:
          GIT_VERSION: ${{ matrix.git }}
        run: |
          set -euo pipefail
          if [ "$GIT_VERSION" = "latest" ]; then
            sudo add-apt-repository -y ppa:git-core/ppa
            sudo apt-get update
            sudo apt-get install -y git
          else
            sudo apt-get update
            sudo apt-get install -y build-essential gettext zlib1g-dev
            # Fetch the official release tarball from kernel.org rather than
            # GitHub's generated archives: those are not guaranteed to remain
            # available and have returned 504s here. Download to a file (not a
            # pipe into tar) so a partial transfer fails loudly.
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
              -o git.tar.gz \
              "https://mirrors.edge.kernel.org/pub/software/scm/git/git-$GIT_VERSION.tar.gz"
            tar xzf git.tar.gz
            cd "git-$GIT_VERSION"
            # Build flags that keep these older releases compiling on current
            # runner images (ubuntu-latest moved to 26.04: GCC 15 + curl 8.18):
            #
            #   -std=gnu17  GCC 15 defaults to C23, where <stddef.h> defines an
            #               `unreachable` macro that collides with git's static
            #               function of the same name. Every version in this
            #               matrix has that function. GCC 13 on ubuntu-24.04
            #               defaulted to gnu17, so this restores the standard
            #               these releases were last known to build against.
            #   NO_CURL     git 2.30's http.h aliases CURLUSESSL_TRY to the
            #               CURLFTPSSL_TRY constant that curl 8.18 removed.
            #               imap-send.c only includes http.h when the Makefile
            #               defines USE_CURL_FOR_IMAP_SEND, which it skips under
            #               NO_CURL, so this sidesteps the breakage entirely.
            #
            # Dropping the curl/expat/openssl transports is safe here: these
            # tests only exercise local plumbing (ls-files, diff, rev-parse,
            # cat-file, show, add), never a network remote.
            make_args=(
              prefix=/usr/local
              CFLAGS="-g -O2 -Wall -std=gnu17"
              NO_CURL=1
              NO_EXPAT=1
              NO_OPENSSL=1
              NO_TCLTK=1
            )
            make -j"$(nproc)" "${make_args[@]}" all
            sudo make "${make_args[@]}" install
          fi
          git --version

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "27"
          elixir-version: "1.19"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-1.19-27-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-1.19-27-

      - run: mix deps.get
      - run: mix test --include slow

  dialyzer-cold:
    name: Dialyzer (cold PLT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "27"
          elixir-version: "1.19"

      - run: mix deps.get
      - run: mix dialyzer --format github

  cross-os:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "27"
          elixir-version: "1.19"

      - run: mix deps.get
      - run: mix test --include slow
