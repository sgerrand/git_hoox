name: CI (slow)

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "lib/git_hoox/git.ex"
      - "lib/git_hoox/installer.ex"
      - ".github/workflows/ci-slow.yml"

permissions:
  contents: read

jobs:
  git-matrix:
    name: Git ${{ matrix.git }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        git: ["2.30.2", "2.39.5", "2.45.2", "latest"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install git ${{ matrix.git }}
        run: |
          if [ "${{ matrix.git }}" = "latest" ]; then
            sudo add-apt-repository -y ppa:git-core/ppa
            sudo apt-get update
            sudo apt-get install -y git
          else
            sudo apt-get update
            sudo apt-get install -y build-essential libcurl4-openssl-dev \
              libexpat1-dev gettext libssl-dev libz-dev
            curl -fsSL "https://github.com/git/git/archive/refs/tags/v${{ matrix.git }}.tar.gz" | tar xz
            cd "git-${{ matrix.git }}"
            make prefix=/usr/local NO_TCLTK=1 all
            sudo make prefix=/usr/local NO_TCLTK=1 install
          fi
          git --version

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "27"
          elixir-version: "1.19"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-1.19-27-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-1.19-27-

      - run: mix deps.get
      - run: mix test --include slow

  dialyzer-cold:
    name: Dialyzer (cold PLT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "27"
          elixir-version: "1.19"

      - run: mix deps.get
      - run: mix dialyzer --format github

  cross-os:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "27"
          elixir-version: "1.19"

      - run: mix deps.get
      - run: mix test --include slow
